<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cranberry Elks Random Member Selector</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      min-height: 100vh;

      background: linear-gradient(135deg, #0f172a, #1e293b);

      color: white;

      overflow: hidden;

      display: flex;

      justify-content: center;

      align-items: center;
    }

    .container {

      width: 100%;

      height: 100vh;

      padding: 40px;

      text-align: center;

      display: flex;

      flex-direction: column;

      justify-content: center;

      background: rgba(255,255,255,0.06);

      backdrop-filter: blur(12px);
    }

    .logo {

      width: 220px;

      margin: 0 auto 20px auto;
    }

    h1 {

      margin-top: 0;

      font-size: 6rem;

      margin-bottom: 20px;

      color: #3b82f6;

      text-shadow: 0 0 20px rgba(59,130,246,0.5);
    }

    .subtitle {

      font-size: 1.8rem;

      margin-bottom: 50px;

      opacity: 0.85;
    }

    .button-row {

      display: flex;

      justify-content: center;

      gap: 20px;

      flex-wrap: wrap;

      margin-bottom: 60px;
    }

    button {

      padding: 25px 50px;

      border: none;

      border-radius: 14px;

      font-size: 2rem;

      font-weight: bold;

      cursor: pointer;

      transition: all 0.2s ease;

      color: white;

      background: #2563eb;
    }

    button:hover {

      background: #1d4ed8;

      transform: scale(1.05);
    }

    .number-display {

      font-size: 18rem;

      font-weight: 900;

      line-height: 1;

      min-height: 250px;

      color: #3b82f6;

      text-shadow: 0 0 30px rgba(59,130,246,0.5);
    }

    .member-display {

      margin-top: 30px;

      font-size: 6rem;

      font-weight: bold;

      min-height: 120px;
    }

    .status {

      margin-top: 30px;

      font-size: 1rem;

      opacity: 0.7;
    }

    .pop {

      animation: pop 0.4s ease;
    }

    @keyframes pop {

      0% {

        transform: scale(0.7);

        opacity: 0.3;
      }

      60% {

        transform: scale(1.15);
      }

      100% {

        transform: scale(1);

        opacity: 1;
      }
    }

    @media (max-width: 768px) {

      h1 {

        font-size: 3rem;
      }

      .number-display {

        font-size: 6rem;

        min-height: 100px;
      }

      .member-display {

        font-size: 2rem;
      }

      button {

        font-size: 1.2rem;

        padding: 15px 30px;
      }

      .logo {

        width: 120px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- Replace with your lodge logo -->
    <img
      src="elks-logo.png"
      class="logo"
      alt="Elks Logo"
    />

    <h1>Cranberry Elks</h1>

    <div class="subtitle">
      Random Member Drawing
    </div>

    <div class="button-row">

      <button onclick="generateMember()">

        🎲 Draw A Member

      </button>

    </div>

    <div
      id="numberDisplay"
      class="number-display">

      ---
    </div>

    <div
      id="memberDisplay"
      class="member-display">

      Waiting...
    </div>

    <div
      id="status"
      class="status">

      Loading members.csv...
    </div>

  </div>

  <script>

    let members = [];

    const numberDisplay =
      document.getElementById("numberDisplay");

    const memberDisplay =
      document.getElementById("memberDisplay");

    const statusDisplay =
      document.getElementById("status");

    async function loadMembers() {

      try {

        const response =
          await fetch("members.csv");

        const csvText =
          await response.text();

        parseCSV(csvText);

        statusDisplay.innerHTML =
          `Loaded ${members.length} members`;

      } catch (error) {

        console.error(error);

        statusDisplay.innerHTML =
          "Error loading members.csv";
      }
    }

    function parseCSV(csvText) {

      const lines =
        csvText.trim().split("\n");

      lines.forEach(line => {

        const parts =
          line.split(",");

        if (parts.length >= 3) {

          members.push({

            memberNumber:
              parts[0].trim(),

            lastName:
              parts[1].trim(),

            firstName:
              parts[2].trim()
          });
        }
      });
    }

    function generateMember() {

      if (members.length === 0) {

        alert("No members loaded.");

        return;
      }

      const duration = 3000;

      const intervalSpeed = 60;

      const interval = setInterval(() => {

        const tempMember =
          members[
            Math.floor(Math.random() * members.length)
          ];

        numberDisplay.innerHTML =
          tempMember.memberNumber;

        memberDisplay.innerHTML =
          `${tempMember.firstName} ${tempMember.lastName}`;

      }, intervalSpeed);

      setTimeout(() => {

        clearInterval(interval);

        const finalMember =
          members[
            Math.floor(Math.random() * members.length)
          ];

        numberDisplay.innerHTML =
          finalMember.memberNumber;

        memberDisplay.innerHTML =
          `${finalMember.firstName} ${finalMember.lastName}`;

        animatePop(numberDisplay);

        animatePop(memberDisplay);

      }, duration);
    }

    function animatePop(element) {

      element.classList.remove("pop");

      void element.offsetWidth;

      element.classList.add("pop");
    }

    // Initial load
    loadMembers();

  </script>

</body>
</html>
