<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cranberry Elks Random Member Selector</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family: Arial, Helvetica, sans-serif;

      min-height: 100vh;

      background: linear-gradient(135deg, #0f172a, #1e293b);

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;
    }

    .container {

      width: 100%;

      max-width: 850px;

      padding: 30px;

      text-align: center;

      border-radius: 24px;

      background: rgba(255,255,255,0.08);

      backdrop-filter: blur(10px);

      box-shadow: 0 10px 40px rgba(0,0,0,0.45);

      position: relative;
    }

    .logo {

      width: 100px;

      margin-bottom: 10px;
    }

    h1 {

      margin: 0;

      font-size: 3rem;

      margin-bottom: 10px;

      color: #3b82f6;

      text-shadow: 0 0 15px rgba(59,130,246,0.4);
    }

    .subtitle {

      font-size: 1.1rem;

      margin-bottom: 30px;

      opacity: 0.85;
    }

    button {

      padding: 15px 35px;

      border: none;

      border-radius: 12px;

      font-size: 1.3rem;

      font-weight: bold;

      cursor: pointer;

      background: #2563eb;

      color: white;

      transition: all 0.2s ease;

      margin-bottom: 35px;
    }

    button:hover {

      background: #1d4ed8;

      transform: scale(1.04);
    }

    .number-display {

      font-size: 7rem;

      font-weight: 900;

      line-height: 1;

      min-height: 110px;

      color: #3b82f6;

      text-shadow: 0 0 20px rgba(59,130,246,0.45);
    }

    .member-display {

      margin-top: 15px;

      font-size: 2.8rem;

      font-weight: bold;

      min-height: 60px;
    }

    .status {

      margin-top: 25px;

      font-size: 0.95rem;

      opacity: 0.7;
    }

    .build-number {

      position: absolute;

      bottom: 12px;

      right: 20px;

      font-size: 0.8rem;

      opacity: 0.45;
    }

    .pop {

      animation: pop 0.4s ease;
    }

    @keyframes pop {

      0% {

        transform: scale(0.7);

        opacity: 0.3;
      }

      60% {

        transform: scale(1.12);
      }

      100% {

        transform: scale(1);

        opacity: 1;
      }
    }

    @media (max-width: 768px) {

      .container {

        padding: 20px;
      }

      h1 {

        font-size: 2rem;
      }

      .logo {

        width: 70px;
      }

      .number-display {

        font-size: 4rem;

        min-height: 70px;
      }

      .member-display {

        font-size: 1.6rem;
      }

      button {

        font-size: 1rem;

        padding: 12px 24px;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- Replace with your lodge logo -->
    <img
      src="elks-logo.png"
      class="logo"
      alt="Elks Logo"
    />

    <h1>Cranberry Elks</h1>

    <div class="subtitle">
      Random Member Drawing
    </div>

    <button onclick="generateMember()">
      🎲 Draw Member
    </button>

    <div
      id="numberDisplay"
      class="number-display">

      ---
    </div>

    <div
      id="memberDisplay"
      class="member-display">

      Waiting...
    </div>

    <div
      id="status"
      class="status">

      Loading members.csv...
    </div>

    <div
      id="buildNumber"
      class="build-number">

      Build: Loading...
    </div>

  </div>

  <script>

    /*************************************
     * BUILD NUMBER
     *************************************/

    const BUILD_NUMBER = "26.05.11";

    /*************************************
     * APPLICATION VARIABLES
     *************************************/

    let members = [];

    const numberDisplay =
      document.getElementById("numberDisplay");

    const memberDisplay =
      document.getElementById("memberDisplay");

    const statusDisplay =
      document.getElementById("status");

    const buildNumberDisplay =
      document.getElementById("buildNumber");

    /*************************************
     * LOAD BUILD NUMBER
     *************************************/

    buildNumberDisplay.innerHTML =
      `Build: ${BUILD_NUMBER}`;

    /*************************************
     * LOAD MEMBER FILE
     *************************************/

    async function loadMembers() {

      try {

        const response =
          await fetch("members.csv");

        const csvText =
          await response.text();

        parseCSV(csvText);

        statusDisplay.innerHTML =
          `Loaded ${members.length} members`;

      } catch (error) {

        console.error(error);

        statusDisplay.innerHTML =
          "Error loading members.csv";
      }
    }

    /*************************************
     * PARSE CSV
     *************************************/

    function parseCSV(csvText) {

      const lines =
        csvText.trim().split("\n");

      lines.forEach(line => {

        const parts =
          line.split(",");

        if (parts.length >= 3) {

          members.push({

            memberNumber:
              parts[0].trim(),

            lastName:
              parts[1].trim(),

            firstName:
              parts[2].trim()
          });
        }
      });
    }

    /*************************************
     * GENERATE RANDOM MEMBER
     *************************************/

    function generateMember() {

      if (members.length === 0) {

        alert("No members loaded.");

        return;
      }

      const duration = 2500;

      const intervalSpeed = 60;

      const interval = setInterval(() => {

        const tempMember =
          members[
            Math.floor(Math.random() * members.length)
          ];

        numberDisplay.innerHTML =
          tempMember.memberNumber;

        memberDisplay.innerHTML =
          `${tempMember.firstName} ${tempMember.lastName}`;

      }, intervalSpeed);

      setTimeout(() => {

        clearInterval(interval);

        const finalMember =
          members[
            Math.floor(Math.random() * members.length)
          ];

        numberDisplay.innerHTML =
          finalMember.memberNumber;

        memberDisplay.innerHTML =
          `${finalMember.firstName} ${finalMember.lastName}`;

        animatePop(numberDisplay);

        animatePop(memberDisplay);

      }, duration);
    }

    /*************************************
     * ANIMATION
     *************************************/

    function animatePop(element) {

      element.classList.remove("pop");

      void element.offsetWidth;

      element.classList.add("pop");
    }

    /*************************************
     * INITIALIZE APPLICATION
     *************************************/

    loadMembers();

  </script>

</body>
</html>
